name: Refresh
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check
        run: |
          if [ -z "$GIST_PAT" ]; then
              echo "Error: environment 'GIST_PAT' cannot be empty"
              exit 1
          fi

          if [ -z "$GIST_LINK" ]; then
              echo "Error: environment 'GIST_LINK' cannot be empty"
              exit 1
          fi

          LINK_PARTS=$(echo "$GIST_LINK" | awk -F'/' 'NF==2 && $1!="" && $2!=""')
          if [ -z "$LINK_PARTS" ]; then
              echo "Error: environment 'GIST_LINK' is not valid, should be 'username/gist_id' format"
              exit 1
          fi

      - name: Optimize Concurrency, Timeout and Region Filter
        run: |
          python -c '
          with open("subscribe/utils.py", "r", encoding="utf-8") as f: c = f.read()
          t = "def multi_process_run(func: typing.Callable[..., object], tasks: list[object]) -> list[object]:"
          c = c.replace(t, t + "\n    return multi_thread_run(func=func, tasks=tasks, num_threads=32)")
          with open("subscribe/utils.py", "w", encoding="utf-8") as f: f.write(c)

          with open("subscribe/airport.py", "r", encoding="utf-8") as f: c = f.read()
          c = c.replace("timeout=120", "timeout=20").replace("account, 120,", "account, 20,")
          with open("subscribe/airport.py", "w", encoding="utf-8") as f: f.write(c)

          with open("subscribe/collect.py", "r", encoding="utf-8") as f: c = f.read()
          old = "proxies = list(itertools.chain.from_iterable([x[1] for x in results if x]))"
          new = old + "\n    import re\n    jp_sg = re.compile(r\"(?i)日本|Japan|Tokyo|Osaka|川崎|埼玉|新加坡|狮城|Singapore|\\bJP\\b|\\bSG\\b\")\n    proxies = [p for p in proxies if isinstance(p, dict) and jp_sg.search(p.get(\"name\", \"\"))]\n    logger.info(f\"Pre-filtered Japan/Singapore proxies count: {len(proxies)}\")"
          with open("subscribe/collect.py", "w", encoding="utf-8") as f: f.write(c.replace(old, new))
          '

      - name: Refresh
        run: python -u subscribe/collect.py --all --refresh --overwrite -c -p 15 --delay 2000 -n 64 --url https://gemini.google.com

      - name: Timestamp
        run: date
