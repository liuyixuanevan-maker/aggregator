name: Refresh
on:
  # performed every two hours
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

env:
  # time zone
  TZ: Asia/Shanghai

  # github access token
  GIST_PAT: ${{ secrets.GIST_PAT }}

  # github username and gist id, separated by '/'
  GIST_LINK: ${{ secrets.GIST_LINK }}

  # the url to the list of airports that you maintain yourself
  # each line include domain, coupon and invitation code, the domain must be included, and the latter two items are optional
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}

  # include special protocols, such as vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check
        run: |
          if [ -z "$GIST_PAT" ]; then
              echo "Error: environment 'GIST_PAT' cannot be empty"
              exit 1
          fi

          if [ -z "$GIST_LINK" ]; then
              echo "Error: environment 'GIST_LINK' cannot be empty"
              exit 1
          fi

          LINK_PARTS=$(echo "$GIST_LINK" | awk -F'/' 'NF==2 && $1!="" && $2!=""')
          if [ -z "$LINK_PARTS" ]; then
              echo "Error: environment 'GIST_LINK' is not valid, should be 'username/gist_id' format"
              exit 1
          fi

      - name: Apply Quality and Gemini Filters
        run: |
          sed -i 's/exclude=\[到过\]期/exclude=(?i)港|HK|HongKong|China|CN|[到过]期/g' subscribe/subconverter.py
          python -c '
          with open("subscribe/clash.py", "r", encoding="utf-8") as f: c = f.read()
          c = c.replace("alive = False\n                break", "alive = False\n                break\n            proxy[\"delay\"] = max(proxy.get(\"delay\", 0), data.get(\"delay\", 0))")
          with open("subscribe/clash.py", "w", encoding="utf-8") as f: f.write(c)
          '
          python -c '
          with open("subscribe/collect.py", "r", encoding="utf-8") as f: s = f.read()
          s = s.replace("nodes = [proxies[i] for i in range(len(proxies)) if masks[i]]", "nodes = [proxies[i] for i in range(len(proxies)) if masks[i]]\n        nodes.sort(key=lambda x: x.get(\"delay\", 9999))\n        nodes = nodes[:50]\n        logger.info(f\"Top 50 lowest latency nodes selected! Total: {len(nodes)}\")")
          with open("subscribe/collect.py", "w", encoding="utf-8") as f: f.write(s)
          '

      - name: Refresh
        run: python -u subscribe/collect.py --all --refresh --overwrite --delay 1000 -n 64 --url https://gemini.google.com

      - name: Timestamp
        run: date
