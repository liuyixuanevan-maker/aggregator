name: Collect
on:
  # executed once a week on Sundays at 00:00
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

env:
  # time zone
  TZ: Asia/Shanghai

  # github access token
  GIST_PAT: ${{ secrets.GIST_PAT }}

  # github username and gist id, separated by '/'
  GIST_LINK: ${{ secrets.GIST_LINK }}

  # the url to the list of airports that you maintain yourself
  # each line include domain, coupon and invitation code, the domain must be included, and the latter two items are optional
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}

  # include special protocols, such as vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check
        run: |
          if [ -z "$GIST_PAT" ]; then
              echo "Error: environment 'GIST_PAT' cannot be empty"
              exit 1
          fi

          if [ -z "$GIST_LINK" ]; then
              echo "Error: environment 'GIST_LINK' cannot be empty"
              exit 1
          fi

          LINK_PARTS=$(echo "$GIST_LINK" | awk -F'/' 'NF==2 && $1!="" && $2!=""')
          if [ -z "$LINK_PARTS" ]; then
              echo "Error: environment 'GIST_LINK' is not valid, should be 'username/gist_id' format"
              exit 1
          fi

      - name: Pre-filter Japan and Singapore Nodes
        run: |
          python -c '
          with open("subscribe/collect.py", "r", encoding="utf-8") as f: s = f.read()
          old = "proxies = list(itertools.chain.from_iterable([x[1] for x in results if x]))"
          new = "proxies = list(itertools.chain.from_iterable([x[1] for x in results if x]))\n    import re\n    jp_sg = re.compile(r\"(?i)日|日本|JP|Japan|Tokyo|Osaka|新|新加坡|SG|Singapore\")\n    proxies = [p for p in proxies if isinstance(p, dict) and jp_sg.search(p.get(\"name\", \"\"))]\n    logger.info(f\"Pre-filtered Japan/Singapore proxies count: {len(proxies)}\")"
          s = s.replace(old, new)
          with open("subscribe/collect.py", "w", encoding="utf-8") as f: f.write(s)
          '

      - name: Collect
        run: python -u subscribe/collect.py --all --overwrite -c -p 15 --delay 1000 -n 64 --url https://gemini.google.com

      - name: Timestamp
        run: date
