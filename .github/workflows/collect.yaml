name: Collect
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  CUSTOMIZE_LINK: ${{ secrets.CUSTOMIZE_LINK }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check
        run: |
          if [ -z "$GIST_PAT" ]; then
              echo "Error: environment 'GIST_PAT' cannot be empty"
              exit 1
          fi

          if [ -z "$GIST_LINK" ]; then
              echo "Error: environment 'GIST_LINK' cannot be empty"
              exit 1
          fi

          LINK_PARTS=$(echo "$GIST_LINK" | awk -F'/' 'NF==2 && $1!="" && $2!=""')
          if [ -z "$LINK_PARTS" ]; then
              echo "Error: environment 'GIST_LINK' is not valid, should be 'username/gist_id' format"
              exit 1
          fi

      - name: Optimize Concurrency, Timeout and Region Filter
        run: |
          cat << 'EOF' > patch_script.py
import re

with open("subscribe/utils.py", "r", encoding="utf-8") as f:
    c = f.read()
t = "def multi_process_run(func: typing.Callable[..., object], tasks: list[object]) -> list[object]:"
c = c.replace(t, t + "\n    return multi_thread_run(func=func, tasks=tasks, num_threads=32)")
with open("subscribe/utils.py", "w", encoding="utf-8") as f:
    f.write(c)

with open("subscribe/airport.py", "r", encoding="utf-8") as f:
    c = f.read()
c = c.replace("timeout=120", "timeout=20").replace("account, 120,", "account, 20,")
with open("subscribe/airport.py", "w", encoding="utf-8") as f:
    f.write(c)

with open("subscribe/collect.py", "r", encoding="utf-8") as f:
    c = f.read()

old = "proxies = list(itertools.chain.from_iterable([x[1] for x in results if x]))"
add_code = """
    import re
    jp_sg_tw = re.compile(r"(?i)日本|Japan|Tokyo|Osaka|川崎|埼玉|新加坡|狮城|Singapore|台湾|台灣|Taiwan|Taipei|新北|高雄|\\bJP\\b|\\bSG\\b|\\bTW\\b")
    def is_anti_gfw(p):
        if not isinstance(p, dict): return False
        ptype = str(p.get("type", "")).lower()
        if ptype in ["hysteria2", "hy2"]: return True
        sec = str(p.get("security", "")).lower()
        net = str(p.get("network", "")).lower()
        tls = bool(p.get("tls")) or sec == "tls"
        if ptype == "vless":
            if sec == "reality" or "reality-opts" in p: return True
            if net == "ws" and tls: return True
        if ptype in ["vmess", "trojan"]:
            if net == "ws" and tls: return True
        return False
    proxies = [p for p in proxies if isinstance(p, dict) and jp_sg_tw.search(p.get("name", "")) and is_anti_gfw(p)]
    logger.info(f"Filtered Anti-GFW JP/SG/TW proxies count: {len(proxies)}")
"""
with open("subscribe/collect.py", "w", encoding="utf-8") as f:
    f.write(c.replace(old, old + add_code))
print("Patches applied cleanly!")
EOF
          python patch_script.py

      - name: Collect
        run: python -u subscribe/collect.py --all --refresh --overwrite -c -p 15 --delay 2500 -n 64 --url https://gemini.google.com

      - name: Timestamp
        run: date
